{% extends "nfo/__base__.html" %}
{% load pagination %}
{% load nfosnippet %}
{% block content %}
    <div class="container-xxl">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="{% url 'home' %}">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{% url 'dataset-list' %}">Manage Dataset</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">{{ object.name }}</li>
            </ol>
        </nav>
        <div class="card mb-3">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">Are you sure to delete this Dataset?</div>    
                    <input type="hidden" value="Confirm">
                    <button type="submit" class="btn btn-primary">Confirm</button>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
