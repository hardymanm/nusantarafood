{% extends "nfo/__base__.html" %}
{% load nfosnippet %}
{% block content %}
    <div class="container-xxl">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="{% url 'home' %}">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{% url 'dataset-list' %}">Manage Dataset</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{% url 'dataset-detail' object.pk %}">{{ object.name }}</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">LDA Model</li>
            </ol>
        </nav>

        <div class="card mb-3">
            <div class="card-body">
                <h3>
                    <span class="text-muted">Dataset:</span> {{ object.name }}
                </h3>
            </div>
        </div>

    </div>
{% endblock content %}
